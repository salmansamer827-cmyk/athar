<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | أثر للهوية البصرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-white">لوحة تحكم أثر</h1>
                <p class="text-xs text-slate-400">إضافة وإدارة مشاريع الهوية البصرية</p>
            </div>
            <a href="http://127.0.0.1:3000" target="_blank" class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-sm hover:border-amber-500 transition">عرض الموقع الرئيسی ↗</a>
        </div>

        <!-- Add Project Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-8">
            <h2 class="text-lg font-bold mb-4 text-amber-400">إضافة مشروع هويّة جديد</h2>
            
            <form id="add-project-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">عنوان المشروع</label>
                    <input type="text" id="title" required placeholder="مثال: هوية شركة التقنية الحديثة" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">العنوان الفرعي أو التخصص</label>
                        <input type="text" id="subtitle" required placeholder="مثال: Branding & Guidelines" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-300">التصنيف</label>
                        <input type="text" id="category" required placeholder="مثال: Brand Identity" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">رابط صورة الغلاف (URL)</label>
                    <input type="url" id="cover_image" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">وصف المشروع</label>
                    <textarea id="description" rows="3" required placeholder="تفاصيل حول فلسفة الشعار وتصميم الهوية..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/10">حفظ ونشر المشروع</button>
            </form>
            <div id="admin-response" class="mt-4 text-center text-sm hidden"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000"\;

        document.getElementById('add-project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const subtitle = document.getElementById('subtitle').value;
            const category = document.getElementById('category').value;
            const cover_image = document.getElementById('cover_image').value;
            const description = document.getElementById('description').value;
            const responseDiv = document.getElementById('admin-response');

            try {
                const res = await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, subtitle, category, cover_image, description })
                });

                if (res.ok) {
                    responseDiv.textContent = "تم إضافة ونشر المشروع بنجاح في الموقع!";
                    responseDiv.className = "mt-4 text-center text-sm text-emerald-400 font-semibold";
                    document.getElementById('add-project-form').reset();
                } else {
                    throw new Error("Failed to add project");
                }
            } catch (err) {
                responseDiv.textContent = "حدث خطأ أثناء إضافة المشروع. تأكد من تشغيل الـ Backend.";
                responseDiv.className = "mt-4 text-center text-sm text-red-400";
            }
        });
    </script>
</body>
</html>
