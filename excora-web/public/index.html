<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXCORA - منصة التداول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e11;
            color: #eaecef;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f0b90b;
            text-align: center;
        }
        .market-container {
            max-width: 600px;
            margin: 0 auto;
            background: #181a20;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ticker-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #292d3e;
            font-size: 18px;
        }
        .symbol {
            font-weight: bold;
            color: #fff;
        }
        .price {
            font-family: monospace;
            color: #0ecb81;
        }
    </style>
</head>
<body>

    <h1>EXCORA Trading Terminal</h1>
    
    <div class="market-container">
        <div class="ticker-row">
            <span class="symbol">BTC / USDT</span>
            <span id="btc-price" class="price">جاري الاتصال بالسوق...</span>
        </div>
        <div class="ticker-row">
            <span class="symbol">ETH / USDT</span>
            <span id="eth-price" class="price">جاري الاتصال بالسوق...</span>
        </div>
        <div class="ticker-row">
            <span class="symbol">SOL / USDT</span>
            <span id="sol-price" class="price">جاري الاتصال بالسوق...</span>
        </div>
    </div>

    <script>
        const ws = new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@trade/ethusdt@trade/solusdt@trade');

        ws.onmessage = function (event) {
            const message = JSON.parse(event.data);
            if (message.data) {
                const stockData = message.data;
                const baseSymbol = stockData.s.toLowerCase().replace('usdt', '');
                const priceElement = document.getElementById(`${baseSymbol}-price`);
                
                if (priceElement) {
                    const newPrice = parseFloat(stockData.p).toFixed(2);
                    priceElement.innerText = `$${newPrice}`;
                }
            }
        };
    </script>

</body>
</html>
